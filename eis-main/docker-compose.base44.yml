services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./supabase/migrations:/migrations:ro
    environment:
      - PGPASSWORD=postgres
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h db -U postgres -f /migrations/000_local_init.sql &&
        echo "Migrations complete"

  api:
    image: postgrest/postgrest:v12.2.3
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      - PGRST_DB_URI=postgres://postgres:postgres@db:5432/postgres
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long
      - PGRST_DB_SCHEMA=public
      - PGRST_SERVER_PORT=3000

  proxy:
    image: nginx:alpine
    restart: on-failure
    depends_on:
      - api
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/rest/v1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Local PostgREST fallback — real Supabase is missing the placement_id column.
      # Remove these two lines once the column is added to the real Supabase project.
      - VITE_SUPABASE_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIn0.oSCcZHxRGIuAhvf8EdR5fLbwTPpw4E2nvrAMTbS1TUk
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0"]
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
